# GeeksPro Control 2.0 — сервер (stage/production), каталог /opt/geekspro2.
#
#   cd /opt/geekspro2 && docker compose -f docker-compose.prod.yml up -d --build
#
# Изоляция от 1.0 (/root/GeeksProControl, проект geekspro):
#   - имя проекта geekspro2, тома и сеть с явными именами geekspro2_*;
#   - ничего не объявлено external, container_name не задаётся;
#   - PostgreSQL и Redis не публикуют порты вообще — только внутренняя сеть;
#   - web слушает 127.0.0.1:8100, наружу его открывает только nginx;
#   - файлы — в /opt/geekspro2/storage, а не в каталоге 1.0.
#
# Ресурсы (этап 11A): 2.0 живёт на одном сервере с 1.0 (3.8 ГБ, свободно ~1.4 ГБ).
# Сумма лимитов без бота ≈ 1.25 ГБ, с ботом ≈ 1.4 ГБ; swap контейнерам не даётся
# (memswap_limit = mem_limit), а oom_score_adj=500 — при нехватке памяти ядро
# первым остановит процессы 2.0, а не 1.0. Лимиты переопределяются из .env.
name: geekspro2

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: geekspro2/app:latest
  restart: unless-stopped
  init: true
  env_file:
    - .env
  networks:
    - internal
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  oom_score_adj: 500
  # api.telegram.org прибит к IPv4: DNS на этом сервере отдаёт для него
  # только AAAA, а IPv6-маршрута у контейнеров нет (так же сделано в 1.0).
  # host.docker.internal — для TELEGRAM_PROXY_URL, если понадобится релей.
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "api.telegram.org:149.154.167.220"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Малая конфигурация: ~10 пользователей Control + Celery.
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=40", "-c", "work_mem=4MB",
              "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=256MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    mem_limit: ${DB_MEM_LIMIT:-384m}
    memswap_limit: ${DB_MEM_LIMIT:-384m}
    cpus: ${DB_CPUS:-1.0}
    oom_score_adj: 500
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    memswap_limit: 96m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      # В день переноса — RUN_MIGRATIONS=0 в .env: migrate запускается вручную по плану
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    volumes:
      - ./storage/static:/app/staticfiles
      - ./storage/media:/app/media
      # Ключ сервисного аккаунта Google (если выгрузка включена) — только чтение.
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8100}:8000"
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    memswap_limit: ${WEB_MEM_LIMIT:-384m}
    cpus: ${WEB_CPUS:-1.0}
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; h=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': h, 'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery:
    <<: *app
    command: celery -A core worker -l info --concurrency ${CELERY_CONCURRENCY:-1} --max-tasks-per-child 100
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    volumes:
      - ./storage/media:/app/media
      - ./secrets:/app/secrets:ro
    mem_limit: ${CELERY_MEM_LIMIT:-256m}
    memswap_limit: ${CELERY_MEM_LIMIT:-256m}
    cpus: ${CELERY_CPUS:-0.5}
    # Даём задачам доработать после SIGTERM (warm shutdown).
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    <<: *app
    command: celery -A core beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25

  # Включается отдельно и только с собственным токеном 2.0:
  #   docker compose -f docker-compose.prod.yml --profile bot up -d bot
  bot:
    <<: *app
    command: python manage.py run_telegram_bot  # единственный бот 2.0 (этап 10A)
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    profiles: ["bot"]
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.25

volumes:
  postgres_data:
    name: geekspro2_postgres_data

networks:
  internal:
    name: geekspro2_internal
