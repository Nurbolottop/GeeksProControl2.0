# Шаг 1 (однократно): только HTTP, чтобы certbot получил сертификат.
# /etc/nginx/sites-available/gpro.zeastudio.su — потом заменяется основным
# конфигом gpro.zeastudio.su.conf. Конфиг 1.0 (geekspro.zeastudio.su) не трогаем.
server {
    listen 80;
    listen [::]:80;
    server_name gpro.zeastudio.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
