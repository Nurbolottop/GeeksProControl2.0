# GeeksPro Control 2.0 — /etc/nginx/sites-available/gpro.zeastudio.su
#
# Отдельный server только для gpro.zeastudio.su: конфиг 1.0
# (geekspro.zeastudio.su → 127.0.0.1:8087) не меняется.
# Общие лимиты запросов сервера (conf.d/ratelimit.conf) действуют и здесь.
#
# Перед reload всегда: nginx -t

upstream geekspro2_web {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gpro.zeastudio.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gpro.zeastudio.su;

    ssl_certificate     /etc/letsencrypt/live/gpro.zeastudio.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpro.zeastudio.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Совпадает с лимитом загрузок Django (20 МБ) с запасом на multipart.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Тестовая версия не должна попадать в поисковики.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Пока идёт разработка, весь сайт закрыт паролем: это не рабочая система
    # для стажёров. Файл паролей создаётся на сервере (см. docs/deployment.md)
    # и в Git не хранится.
    auth_basic "GeeksPro Control 2.0 — test";
    auth_basic_user_file /etc/nginx/geekspro2.htpasswd;

    location /static/ {
        alias /opt/geekspro2/storage/static/;
        expires 7d;
        access_log off;
    }

    # Файлы media напрямую не открываются: /media/… уходит в Django
    # (location /), он проверяет права и отвечает X-Accel-Redirect сюда.
    location /protected-media/ {
        internal;
        alias /opt/geekspro2/storage/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Вебхук видеосервиса (этап 11A): без Basic Auth — JaaS его не знает; подлинность
    # проверяет Django по подписи X-Jaas-Signature, тело ограничено 256 КБ.
    location /video/webhook/ {
        auth_basic off;
        client_max_body_size 256k;
        proxy_pass http://geekspro2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /robots.txt {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://geekspro2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Заголовок Basic-авторизации nginx в Django не передаём.
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}
