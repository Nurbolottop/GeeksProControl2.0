{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо — GeeksPro</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>Geeks<span style="background: linear-gradient(120deg,#5b6cf9,#8b7cf9); -webkit-background-clip: text; background-clip: text; color: transparent;">Pro</span></h1>
        {% if is_edit %}
            <p class="sub">Спасибо! Изменения сохранены — работодателям уйдут обновлённые данные.</p>
        {% else %}
            <p class="sub">Спасибо! Анкета отправлена и ушла на проверку. Мы свяжемся с вами, когда появится подходящая вакансия.</p>
        {% endif %}
    </div>
</div>
</body>
</html>
