<li class="att-person" id="person-{{ row.intern.pk }}">
    <div class="att-person__who">
        <a class="gp-link gp-table__primary" href="{{ row.intern.get_absolute_url }}">{{ row.intern.full_name }}</a>
        <span class="gp-table__secondary">{{ row.intern.specialization|default:'' }}</span>
    </div>
    <div class="att-person__marks" role="group" aria-label="Отметка {{ row.intern.full_name }}">
        <button type="button" class="gp-mark__state{% if row.status == 'present' %} gp-mark__state--present{% endif %}" aria-pressed="{% if row.status == 'present' %}true{% else %}false{% endif %}"
                hx-post="{% url 'attendance:mark_person' meeting.pk %}"
                hx-vals='{"intern": "{{ row.intern.pk }}", "status": "{% if row.status == 'present' %}{% else %}present{% endif %}"}'
                hx-target="#person-{{ row.intern.pk }}" hx-swap="outerHTML">✓ Был</button>
        <button type="button" class="gp-mark__state{% if row.status == 'absent' %} gp-mark__state--absent{% endif %}" aria-pressed="{% if row.status == 'absent' %}true{% else %}false{% endif %}"
                hx-post="{% url 'attendance:mark_person' meeting.pk %}"
                hx-vals='{"intern": "{{ row.intern.pk }}", "status": "{% if row.status == 'absent' %}{% else %}absent{% endif %}"}'
                hx-target="#person-{{ row.intern.pk }}" hx-swap="outerHTML">✕ Не был</button>
        <button type="button" class="gp-mark__state{% if row.status == 'late' %} gp-mark__state--late{% endif %}" aria-pressed="{% if row.status == 'late' %}true{% else %}false{% endif %}"
                hx-post="{% url 'attendance:mark_person' meeting.pk %}"
                hx-vals='{"intern": "{{ row.intern.pk }}", "status": "{% if row.status == 'late' %}{% else %}late{% endif %}"}'
                hx-target="#person-{{ row.intern.pk }}" hx-swap="outerHTML">Опоздал</button>
        <button type="button" class="gp-mark__state{% if row.status == 'excused' %} gp-mark__state--excused{% endif %}" aria-pressed="{% if row.status == 'excused' %}true{% else %}false{% endif %}"
                hx-post="{% url 'attendance:mark_person' meeting.pk %}"
                hx-vals='{"intern": "{{ row.intern.pk }}", "status": "{% if row.status == 'excused' %}{% else %}excused{% endif %}"}'
                hx-target="#person-{{ row.intern.pk }}" hx-swap="outerHTML">Уважительная</button>
    </div>
</li>
