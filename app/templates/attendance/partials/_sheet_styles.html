<style>
/* Табель группы (2.0): сетка «человек × собрание». Только токены — работает в обеих темах. */
.att-sheet { width: max-content; min-width: 100%; }
.att-sheet th, .att-sheet td { padding: var(--space-1) var(--space-1); text-align: center; vertical-align: middle; }
.att-sheet thead th { text-transform: none; letter-spacing: 0; white-space: nowrap; }
.att-sheet .att-name {
    position: sticky; left: 0; z-index: 1;
    min-width: 180px; max-width: 240px; padding: var(--space-2) var(--space-4);
    text-align: left; background: var(--color-surface); border-right: 1px solid var(--color-border);
}
.att-sheet thead .att-name { z-index: 2; background: var(--color-surface-sunken); }
.att-sheet tbody tr:hover .att-name { background: var(--color-surface-hover); }
.att-sheet tfoot td { border-top: 1px solid var(--color-border); background: var(--color-surface-sunken); }
.att-sheet tfoot .att-name { background: var(--color-surface-sunken); font-size: var(--text-xs); color: var(--color-text-subtle); }
.att-day { width: 52px; padding: var(--space-2) 2px !important; line-height: 1.3; }
.att-day__weekday { display: block; font-size: 10px; color: var(--color-text-subtle); text-transform: uppercase; }
.att-day__date { display: block; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-text); }
.att-day__kind { display: block; font-size: 10px; font-weight: var(--weight-semibold); color: var(--color-text-muted); }
.att-total { min-width: 88px; padding-inline: var(--space-3) !important; }
.att-cell { min-width: 44px; }
.att-mark {
    display: inline-grid; place-items: center;
    width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-text-muted);
    font: inherit; font-size: var(--text-sm); font-weight: var(--weight-bold); font-style: normal; line-height: 1;
}
button.att-mark { cursor: pointer; transition: border-color var(--duration-fast), transform var(--duration-fast); }
button.att-mark:hover { border-color: var(--color-border-strong); transform: scale(1.08); }
button.att-mark:focus-visible { outline: none; box-shadow: var(--ring); }
.att-mark--empty { background: var(--color-surface-sunken); }
.att-mark--present { background: var(--color-success-soft); color: var(--color-success-text); border-color: transparent; }
.att-mark--absent { background: var(--color-danger-soft); color: var(--color-danger-text); border-color: transparent; }
.att-mark--late { background: var(--color-warning-soft); color: var(--color-warning-text); border-color: transparent; }
.att-mark--excused { background: var(--color-info-soft); color: var(--color-info-text); border-color: transparent; }
.att-legend .att-mark { width: 22px; height: 22px; font-size: var(--text-xs); }
.att-score {
    display: block; width: max-content; margin: 2px auto 0; padding: 0 5px;
    border-radius: var(--radius-full); font-size: 10px; font-weight: var(--weight-bold); line-height: 1.5;
}
.att-score--high { background: var(--color-success-soft); color: var(--color-success-text); }
.att-score--mid { background: var(--color-warning-soft); color: var(--color-warning-text); }
.att-score--low { background: var(--color-danger-soft); color: var(--color-danger-text); }
/* Собрание: строки отметок */
.att-people { list-style: none; margin: 0; padding: 0; }
.att-person { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--color-border); }
.att-person:last-child { border-bottom: 0; }
.att-person__who { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
.att-person__marks { display: flex; flex-wrap: wrap; gap: var(--space-2); }
@media (max-width: 479.98px) { .att-person { padding: var(--space-3) var(--space-4); } }
</style>
