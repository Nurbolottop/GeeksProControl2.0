{% load ui %}<dialog class="gp-drawer{% if side == 'left' %} gp-drawer--left{% endif %}{% if size %} gp-drawer--{{ size }}{% endif %}" id="{{ id }}" aria-labelledby="{{ id }}-title" data-gp-dismissable{% if autoopen %} data-gp-autoopen{% endif %}>
    <div class="gp-drawer__panel">
        <header class="gp-drawer__header">
            <h2 class="gp-drawer__title" id="{{ id }}-title">{{ title }}</h2>
            {% ui_button "Закрыть" variant="ghost" size="sm" icon_name="x" label_hidden=True data_gp_close=True %}
        </header>
        <div class="gp-drawer__body">{{ body }}</div>
        {% if slots.footer %}<footer class="gp-drawer__footer">{{ slots.footer }}</footer>{% endif %}
    </div>
</dialog>
