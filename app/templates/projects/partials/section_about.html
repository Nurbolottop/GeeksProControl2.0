<div class="panel" id="section-about">
    <div class="panel-head">
        <h2>Описание</h2>
        <button class="btn-edit"
                hx-get="{% url 'projects:section' project.pk 'about' %}?edit=1"
                hx-target="#section-about" hx-swap="outerHTML">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            Изменить
        </button>
    </div>
    {% if project.description %}
        <p style="margin: 0 0 14px">{{ project.description|linebreaksbr }}</p>
    {% else %}
        <div class="empty" style="padding-top: 0">Описание не заполнено.</div>
    {% endif %}
    <div class="meta-row" style="border-bottom: none; padding-bottom: 0">
        <span>Комментарий руководителя</span>
        <div style="text-align: right">{{ project.head_comment|linebreaksbr|default:'—' }}</div>
    </div>
</div>
