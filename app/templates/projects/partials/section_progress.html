{% load static %}
<div class="panel" id="section-progress">
    <div class="panel-head">
        <h2>Прогресс</h2>
        <button class="btn-edit"
                hx-get="{% url 'projects:section' project.pk 'progress' %}?edit=1"
                hx-target="#section-progress" hx-swap="outerHTML">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            Изменить
        </button>
    </div>
    <div class="progress">
        <div class="progress__bar" style="height: 10px"><div class="progress__fill" style="width: {{ project.progress }}%"></div></div>
        <span class="progress__label">{{ project.progress }}%</span>
    </div>
    <div style="margin-top: 10px; font-size: 13px; color: var(--text-muted)">
        Текущий этап: <strong style="color: var(--text)">{{ project.get_current_stage_display }}</strong>
        — <a href="?tab=stages">все этапы →</a>
    </div>
</div>
