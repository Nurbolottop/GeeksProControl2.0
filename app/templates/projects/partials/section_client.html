<div class="panel" id="section-client">
    <div class="panel-head">
        <h2>Заказчик</h2>
        <button class="btn-edit"
                hx-get="{% url 'projects:section' project.pk 'client' %}?edit=1"
                hx-target="#section-client" hx-swap="outerHTML">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            Изменить
        </button>
    </div>
    <div class="meta-list">
        <div class="meta-row">
            <span>Заказчик</span>
            <div>{% if project.client %}<a href="{% url 'clients:detail' project.client.pk %}">{{ project.client }}</a>{% else %}—{% endif %}</div>
        </div>
        <div class="meta-row"><span>Контактное лицо</span><div>{{ project.client.contact_name|default:'—' }}</div></div>
        <div class="meta-row"><span>Телефон</span><div>{{ project.client.phone|default:'—' }}</div></div>
        <div class="meta-row"><span>Email</span><div>{{ project.client.email|default:'—' }}</div></div>
        <div class="meta-row"><span>Город / филиал</span><div>{{ project.city|default:'—' }}</div></div>
    </div>
</div>
