{% load ui %}<form method="get" class="gp-card" style="margin-bottom: var(--space-4)" hx-get="" hx-target="#project-list" hx-push-url="true" hx-trigger="change, input delay:400ms from:input[name=q]" role="search">
    <div class="gp-card__body" style="display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); align-items: end">
        <div class="gp-field" style="grid-column: 1 / -1; min-width: 0"><label class="gp-label" for="f-q">Поиск</label><input class="gp-input" type="search" id="f-q" name="q" value="{{ params.q }}" placeholder="Название, код или заказчик"></div>
        {% if show_status_filter %}<div class="gp-field"><label class="gp-label" for="f-status">Статус</label><select class="gp-select" id="f-status" name="status"><option value="">Все</option>{% for key, label in options.statuses %}<option value="{{ key }}"{% if params.status == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
        <div class="gp-field"><label class="gp-label" for="f-stage">Основной этап</label><select class="gp-select" id="f-stage" name="primary_stage"><option value="">Любой</option><option value="unset"{% if params.primary_stage == 'unset' %} selected{% endif %}>Не выбран</option>{% for key, label in options.stages %}<option value="{{ key }}"{% if params.primary_stage == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
        <div class="gp-field"><label class="gp-label" for="f-type">Тип</label><select class="gp-select" id="f-type" name="type"><option value="">Любой</option>{% for item in options.types %}<option value="{{ item.pk }}"{% if params.type == item.pk|stringformat:"s" %} selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
        <div class="gp-field"><label class="gp-label" for="f-pm">ПМ</label><select class="gp-select" id="f-pm" name="pm"><option value="">Любой</option>{% for pk, name in options.pms %}<option value="{{ pk }}"{% if params.pm == pk|stringformat:"s" %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
        <div class="gp-field"><label class="gp-label" for="f-lead">Тимлид</label><select class="gp-select" id="f-lead" name="lead"><option value="">Любой</option>{% for pk, name in options.leads %}<option value="{{ pk }}"{% if params.lead == pk|stringformat:"s" %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
        <input type="hidden" name="sort" value="{{ sort }}">
        <div class="gp-cluster"><noscript>{% ui_button "Применить" type="submit" %}</noscript>{% if has_filters %}<a class="gp-btn gp-btn--ghost" href="?">Сбросить</a>{% endif %}</div>
    </div>
</form>
