{% load static %}<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
    /* Тема до первой отрисовки — без вспышки светлого экрана */
    try { var t = localStorage.getItem('gp2-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preload" href="{% static 'fonts/InterVariable.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'gp2/tokens.css' %}">
<link rel="stylesheet" href="{% static 'gp2/base.css' %}">
<link rel="stylesheet" href="{% static 'gp2/layout.css' %}">
<link rel="stylesheet" href="{% static 'gp2/components.css' %}">
<link rel="stylesheet" href="{% static 'gp2/utilities.css' %}">
