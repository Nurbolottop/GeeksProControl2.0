{% load static ui %}<!DOCTYPE html>
<html lang="ru">
<head>
    {% include "layouts/_head.html" %}
    <title>{% block title %}GeeksPro Control{% endblock %}</title>
    <script src="{% static 'gp2/app.js' %}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" defer></script>
    <style>
        .gp-auth { min-height: 100dvh; display: grid; place-items: center; padding: var(--space-6) var(--space-4); background:
            radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--color-primary) 12%, transparent), transparent 60%),
            radial-gradient(900px 500px at 110% 110%, color-mix(in srgb, var(--color-info) 10%, transparent), transparent 60%), var(--color-bg); }
        .gp-auth__panel { width: min(420px, 100%); }
        .gp-auth__brand { display: flex; justify-content: center; margin-bottom: var(--space-6); }
        .gp-auth__card { padding: var(--space-8); border: 1px solid var(--color-border); border-radius: var(--radius-xl); background: var(--color-surface); box-shadow: var(--shadow-md); }
        .gp-auth__title { margin: 0 0 var(--space-1); font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: -0.015em; }
        .gp-auth__subtitle { margin: 0 0 var(--space-6); color: var(--color-text-subtle); font-size: var(--text-sm); }
        .gp-auth__foot { margin-top: var(--space-6); text-align: center; font-size: var(--text-xs); color: var(--color-text-subtle); }
        @media (max-width: 479.98px) { .gp-auth__card { padding: var(--space-6) var(--space-5); } }
    </style>
</head>
<body>
<main class="gp-auth">
    <div class="gp-auth__panel">
        <div class="gp-auth__brand">{% include "components/brand.html" %}</div>
        <div class="gp-auth__card">{% block card %}{% endblock %}</div>
        <p class="gp-auth__foot">GeeksPro Control 2.0</p>
    </div>
</main>
</body>
</html>
